<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>document.documentElement.classList.add("js")</script>
<title>Karoline Machado | Arquitetura &amp; Interiores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
:root{--b1:#b0a090;--b2:#c9bbab;--b3:#9a8876;--card:#f5f3f0;--ink:#4a3f35;--light:#fff;--glow:255,255,255}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--b1:#3b332c;--b2:#4d4238;--b3:#2f2822;--card:#4a4037;--ink:#f1ebe4;--light:#f1ebe4}}
:root[data-theme="dark"]{--b1:#3b332c;--b2:#4d4238;--b3:#2f2822;--card:#4a4037;--ink:#f1ebe4;--light:#f1ebe4}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;overflow-x:hidden;color:var(--light);font-family:'Montserrat',system-ui,-apple-system,sans-serif;font-weight:300;
background:linear-gradient(135deg,var(--b1),var(--b2),var(--b3),var(--b1));background-size:300% 300%;animation:flow 16s ease-in-out infinite;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.blob{position:fixed;border-radius:50%;filter:blur(46px);background:rgba(var(--glow),.28);pointer-events:none;animation:drift 14s ease-in-out infinite}
.blob.a{width:280px;height:280px;top:-70px;left:-90px}
.blob.b{width:220px;height:220px;bottom:8%;right:-70px;animation-delay:-5s;animation-duration:18s}
.blob.c{width:160px;height:160px;top:46%;left:-60px;animation-delay:-9s;animation-duration:22s}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:54px 22px 60px;text-align:center}
.ph{position:relative;width:176px;height:176px;margin:0 auto;animation:float 6s ease-in-out infinite}
.ph::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px dashed rgba(255,255,255,.75);animation:spin 26s linear infinite}
.ph::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(255,255,255,.35);animation:ping 3.4s ease-out infinite}
.ph img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.4);animation:pop 1s cubic-bezier(.2,.9,.25,1.2) both}
.logo{margin:34px 0 0;font-weight:200;font-size:40px;line-height:1.05;text-transform:uppercase}
.logo b{display:block;font-weight:200;animation:letters 1.4s cubic-bezier(.2,.8,.2,1) both}
.logo b:nth-child(2){animation-delay:.25s}
.sub{margin:14px 0 0;font-size:11px;letter-spacing:.38em;font-weight:400;position:relative;display:inline-block;padding-bottom:10px}
.sub::after{content:"";position:absolute;left:50%;bottom:0;height:1px;width:0;background:rgba(255,255,255,.8);transform:translateX(-50%);animation:line 1.2s .9s ease forwards}
.bio{margin:20px auto 0;max-width:400px;font-size:15px;line-height:1.75}
.rise{opacity:0;transform:translateY(26px);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 0;padding:18px 22px;border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;letter-spacing:.04em;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 14px 30px rgba(0,0,0,.18)}
.btn:active{transform:scale(.98)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 5s 2.4s ease-in-out infinite}
.btn.main{margin-top:32px;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards,pulse 2.8s 2.2s ease-out infinite;animation-delay:var(--d,0s),2.2s}
.btn svg{width:22px;height:22px;flex:none;transition:transform .4s}
.btn:hover svg{transform:rotate(-12deg) scale(1.15)}
.foot{margin-top:46px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.12)}66%{transform:translate(-25px,35px) scale(.92)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.35);opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes letters{from{opacity:0;letter-spacing:.5em;filter:blur(8px)}to{opacity:1;letter-spacing:.06em;filter:blur(0)}}
@keyframes line{to{width:100%}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes shine{0%,55%{left:-60%}80%,100%{left:130%}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}70%,100%{box-shadow:0 0 0 20px rgba(255,255,255,0)}}
.js:not(.go) *,.js:not(.go) *::before,.js:not(.go) *::after{animation-play-state:paused!important}
@media (prefers-reduced-motion: reduce){.ph,.ph::before,.ph::after,.blob,.btn::after{animation:none!important}.btn.main{animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards!important;animation-delay:var(--d,0s)!important}}
</style>
</head>
